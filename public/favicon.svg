<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Subtle Top-Down Specular Glow -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Jewel Glow Filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="8" stroke-opacity="0.5" />
  
  <!-- Subtle Top Specular Sheen -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#specularGrad)" />

  <!-- Monogram OS -->
  <g fill="#FFFFFF" style="font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: -6px;">
    <text x="256" y="324" font-size="228" text-anchor="middle" dominant-baseline="central">OS</text>
  </g>

  <!-- Live Multi-Agent Fleet Active Indicator Jewel at Top-Right -->
  <circle cx="402" cy="110" r="30" fill="#10B981" opacity="0.6" filter="url(#glowFilter)" />
  <circle cx="402" cy="110" r="22" fill="#10B981" />
  <circle cx="402" cy="110" r="11" fill="#D1FAE5" />
</svg>
