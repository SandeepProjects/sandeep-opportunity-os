name: CI and Daily Sync
on:
  push:
      branches: [main]
        schedule:
            - cron: "0 6 * * *"
            jobs:
              ci:
                  runs-on: ubuntu-latest
                      steps:
                            - uses: actions/checkout@v4
                                  - run: npm run lint
                                        - run: npm run typecheck
                                              - run: npm test
                                                    - run: npm run build
                  - cron: "0 6 * * *"

                  jobs:
                    build-and-test:
                        runs-on: ubuntu-latest

                            steps:
                                  - uses: actions/checkout@v4
                                        - name: Set up Node.js
                                                uses: actions/setup-node@v4
                                                        with:
                                                                  node-version: 20
                                                                        - name: Install dependencies
                                                                                run: npm ci || npm install
                                                                                      - name: Run Lint
                                                                                              run: npm run lint
                                                                                                    - name: Run Typecheck
                                                                                                            run: npm run typecheck
                                                                                                                  - name: Run Tests
                                                                                                                          run: npm test
                                                                                                                                - name: Run Build
                                                                                                                                        run: npm run build
