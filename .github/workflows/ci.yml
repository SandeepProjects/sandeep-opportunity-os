name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Install, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.VITE_NEON_DATABASE_URL }}
      VITE_NEON_DATABASE_URL: ${{ secrets.VITE_NEON_DATABASE_URL || secrets.DATABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compiler Check (tsc --noEmit)
        run: npm run typecheck

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Build Production Vite Bundle
        run: npm run build
