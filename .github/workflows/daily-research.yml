name: 5-Hour Opportunity Research Ingestion & Server Sync (Neon Canonical)

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  research-and-sync:
    name: 5-Hour Server Ingestion & Idempotent Sync
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.VITE_NEON_DATABASE_URL }}
      VITE_NEON_DATABASE_URL: ${{ secrets.VITE_NEON_DATABASE_URL || secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.VITE_GOOGLE_SHEET_ID }}
      # Supabase Rollback Fallback
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Execute 5-Hour Canonical Ingestion & Sync Runner
        run: node scripts/sync-data.mjs

